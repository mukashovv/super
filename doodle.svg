<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 584 324" fill="none" aria-labelledby="title desc" role="img">
  <title id="title">Финансовая тетрадь</title>
  <desc id="desc">На раскрытой тетради карандаш выводит график доходов. Рядом лежат монеты.</desc>
  <defs>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(31)">
      <path d="M0 0v5" stroke="#747470" stroke-width=".8"/>
    </pattern>
    <pattern id="tiny" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(37)">
      <path d="M0 0v4" stroke="#474744" stroke-width=".8"/>
    </pattern>
    <g id="coin" stroke="#292928" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-25 0v5.2c.2 5.4 11.3 9 25 9 13.7 0 24.5-4 24.9-9.1L25 0" fill="#e4e4e0" stroke-width="1.65"/>
      <path d="m-20 6 .2 3m3.5-2 .3 3.5m3.7-2.5 .3 3.5m4-2.7 .2 3.5m4-2.9 .1 3.3m4.4-3.2 .1 3.5m4-3.7 .2 3.3m4-3.8 .1 3.1m4.1-4 .1 2.8m3.7-4.1 .1 2.6m3.3-4.2 .1 2.4" stroke-width=".9"/>
      <ellipse rx="25" ry="8.7" fill="#fafaf8" stroke-width="1.7"/>
      <path d="M-19.9-.1c1.2-3.3 10.2-5.9 20.6-5.7 9.9.2 18.6 2.8 19.2 5.8-.8 3.3-10.4 5.5-20.7 5.3-5.6 0-11.2-.8-14.4-2" stroke="#8a8a84" stroke-width=".9"/>
      <path d="m-5.8 1.8 6-4.2 5.8 1-6 4.1z" stroke-width="1.1"/>
    </g>
  </defs>
  <style>
    .chart{stroke-dasharray:151;stroke-dashoffset:0;animation:trace 7s ease-in-out infinite}
    .pen{transform-origin:412px 133px;animation:write 7s ease-in-out infinite}
    .glint{transform-box:fill-box;transform-origin:center;animation:glint 7s ease-in-out infinite}
    @keyframes trace{0%,9%{stroke-dashoffset:151}56%,86%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}
    @keyframes write{0%,12%,100%{transform:translate(0,0) rotate(0)}26%{transform:translate(-3px,2px) rotate(-2deg)}42%{transform:translate(1px,-2px) rotate(1deg)}60%,87%{transform:translate(3px,-4px) rotate(2deg)}}
    @keyframes glint{0%,40%,78%,100%{transform:scale(.8);opacity:.55}58%{transform:scale(1.08);opacity:1}}
    @media(prefers-reduced-motion:reduce){.chart,.pen,.glint{animation:none}}
  </style>

  <!-- Low, broken ground strokes keep the drawing on a white page. -->
  <g stroke="#b6b6b1" stroke-width="1.05" stroke-linecap="round">
    <path d="m65 242 35 2m-22 4 39 2m-14 4 17 .8m286-8 33-2m-4 6 54-3m-32 7 18-1m-253 27 31 1m-15 3 9 .4"/>
  </g>
  <g stroke="#282827" stroke-linejoin="round" stroke-linecap="round">
    <!-- Rounded cloth cover, layered signatures and the loose bookmark. -->
    <path d="m117 82 160 35 171-32c4.8-1 7.2.4 6.2 5L421 227c-.5 2.6-2 3.9-4.6 4.4l-152 31.5c-5 .8-9 .8-14.5-1.6L79.2 223c-3.4-.8-4.4-3.3-3.3-6.5l34.6-130c.8-3.1 3.1-4.8 6.5-4.5z" fill="#333332" stroke-width="2.2"/>
    <path d="m124 78 154 31.6 169-30.8-33.1 145.6-150.6 31.7c-6.4 1.7-8.6 1.5-16.2-.7L83.8 218.2z" fill="#e2e2dd" stroke-width="1.6"/>
    <path d="m91 212.9 138.3 31.8c9.1 1.8 15.2 4.1 21.1 7.7m17.1.9c6.8-4.5 18.1-5.9 28.4-8.2l113.3-22.6m-316-5.7 117.5 27.4m98.3-.2 96.2-20.4" stroke-width=".9" stroke="#7d7d77"/>
    <path d="m266.8 250.5-7.3 26.5-5.2-7.9-8.4 4.5 7.3-23.8" fill="#74746f" stroke-width="1.5"/>
    <path d="m260.7 254.7-4.2 12.8" stroke="#bdbdb8" stroke-width=".9"/>
    <!-- Both leaves bow into one hand-inked spine. -->
    <path d="M121.7 70.2c32.4 13.4 91.2 13.5 131.4 24.4 12.2 3.3 19.8 8.2 26.9 14.3L252 252c-7.5-7.7-18.8-10.9-35.8-14.5l-129.5-29.7Z" fill="#fff" stroke-width="2.15"/>
    <path d="M280 108.9c11.7-9.3 24.6-12.1 39.5-14.9 43.9-8.3 96.6-13.3 124.6-25.1l-32.2 147.3c-31.7 10.3-74.8 14.6-119.8 23.8-16.6 3.5-29.1 5.7-40.1 12Z" fill="#fbfbf8" stroke-width="2.15"/>
    <path d="M276.8 113.3c-7 31.5-17.8 94.1-25.4 132.5m33.6-133c-6.5 32.5-17.1 90.2-24.9 126.6" stroke="#92928c" stroke-width=".9"/>
    <path d="M274.5 115c-4.3 26-19.9 107.7-23.6 128.1l-4-2.5c3.9-16.4 19.3-102.2 22.1-127.8z" fill="url(#hatch)" stroke="none"/>
    <path d="M291 106c-4.9 17.5-22.5 116.5-23.8 130l-5.6 2.6c5.1-24.1 19.7-104.9 23.2-127.3z" fill="url(#hatch)" opacity=".55" stroke="none"/>

    <!-- Ledger grid. Ink amounts are abstract marks, not sample personal data. -->
    <g transform="matrix(.95 .205 -.222 .944 132 90)">
      <path d="M0 0h53" stroke-width="3.1"/><path d="M0 7h35m45-2h31" stroke-width="1.25"/>
      <path d="M0 19h129v88H0z" fill="#fff" stroke-width="1.25"/>
      <path d="M.4 19.6h127.9v12.9H.4z" fill="#e4e4df" stroke="none"/>
      <path d="M0 33h129M0 48h129M0 63h129M0 78h129M0 93h129m-107-74v88m69-88v88" stroke="#8a8a84" stroke-width=".82"/>
      <path d="M5 26h10m13 0h20m50 0h17M5 40h7m17 0h29m41 0h16M5 55h9m15 0h17m53 0h20M5 70h8m16 0h32m38 0h13M5 85h9m15 0h25m45 0h19M6 99h8m15 0h20m51 0h14" stroke-width="1.6"/>
      <path d="m62 39 6 0m-15 16h8m-5 30h7m-10 14 5 0" stroke="#969691" stroke-width="1.25"/>
      <path d="M0 116h37m4.8 0h9.2" stroke="#80807c" stroke-width="1.2"/>
    </g>

    <g transform="matrix(.96 -.178 -.208 .98 309 110)">
      <path d="M0 0h43" stroke-width="2.9"/><path d="M0 7h25" stroke-width="1.15"/>
      <path d="M1 24v64h103" stroke-width="1.55"/>
      <path d="M6 39h98M6 57h98M6 74h98" stroke="#c6c6bf" stroke-width=".8" stroke-dasharray="2 4"/>
      <path d="M13 87V72h9v15m12 0V61h9v26m12 0V67h9v20m12 0V49h9v38" fill="#e1e1db" stroke="#8a8a82" stroke-width=".95"/>
      <path class="chart" d="m10 65 20-19 19 5 16-17 12 2 23-23" stroke="#282827" stroke-width="2.8"/>
      <path d="M0 101h37m8 0h15m-60 7h21" stroke="#83837c" stroke-width="1.2"/>
    </g>

    <!-- Sharpened wooden pencil tilted across the notebook. -->
    <g class="pen">
      <g transform="translate(406 126) rotate(-54)">
        <path d="m0 0 20-5.1 83 .2c2.6.2 4.1 2.9 4 5.3-.1 2.5-1.6 4.8-4.3 5.2L19.7 5z" fill="#f6f6f2" stroke-width="1.6"/>
        <path d="m0 0 7.8-2.1-.2 3.8Z" fill="#222221" stroke-width=".8"/>
        <path d="m18.2-4.7 2.2 2.4-2 2.5 2.4 2.2-.7 2.5m.7-7.2 71 .1m-71.4 4.6 71.2.2" stroke-width="1.05"/>
        <path d="m20.6 2.2 71.2.1v2.6L20 4.8z" fill="#8c8c86" stroke="none"/>
        <path d="m92-4.8 7.3.1-.1 10.1-7.4.1z" fill="url(#tiny)" stroke-width="1.1"/>
      </g>
    </g>

    <!-- Two small uneven stacks share the lower-right edge of the book. -->
    <g transform="translate(426 245) rotate(-4)">
      <use href="#coin" x="0" y="0"/><use href="#coin" x="1" y="-6"/><use href="#coin" x="-1" y="-12"/>
      <use href="#coin" x="0" y="-18"/><use href="#coin" x="-.5" y="-24"/>
    </g>
    <g transform="translate(464 249) rotate(5)">
      <use href="#coin"/><use href="#coin" x="1" y="-6"/>
    </g>
    <g transform="translate(99 233) rotate(-14) scale(.76)">
      <use href="#coin"/>
    </g>
    <!-- Marginal marks echo tiny pen drawings beside a calculation. -->
    <path class="glint" d="M100 48c-.2 6.6-2.7 9.6-8.8 10.5 6 1.2 8.8 3.7 9.4 10.1.7-6.4 3.4-9.2 9.2-10.7-6.3-.8-8.3-3-9.8-9.9z" fill="white" stroke-width="1.45"/>
    <path d="m147 55 1.2-6.2m3.8 8.2 4.7-4.1m313.8 110.4c5.2.7 8.6-1.6 10.6-6.1m-8.6 13.1 5.1-.3" stroke-width="1.5"/>
    <path d="m74 143-4-2m2.8 7.6-6 .7m413.6 42.8 1.2-3.8 1.5 3.5 3.8 1-3.3 1.7-1 3.6-1.9-3.5-3.3-1.1z" stroke-width="1.15"/>
  </g>
</svg>
